<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Express Autocare</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; display: flex; min-height: 100vh; align-items: center; justify-content: center; text-align: center; color: #374151; padding: 20px; }
    h1 { color: #c4161c; font-size: 1.25rem; }
    button { margin-top: 12px; border-radius: 10px; padding: 12px 28px; font-size: 1rem; border: 0; background: #c4161c; color: #fff; }
  </style>
</head>
<body>
  <div>
    <h1>You're offline</h1>
    <p>Check your internet connection and try again.</p>
    <button onclick="history.length > 1 ? history.back() : location.reload()">Try again</button>
  </div>
</body>
</html>
